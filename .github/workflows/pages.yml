name: Deploy to GitHub Pages

# Publishes the site: the live map at the root, and a preview of every open
# pull request at previews/pr-<number>/. The files live on the gh-pages branch,
# and every change to it is published as a whole.
#
# - A push to main builds main into the root, keeping the previews.
# - A finished "Preview build" copies that pull request's built files into
#   previews/pr-<number>/ and links them on the pull request. It never checks
#   out or runs the pull request's code: it only copies files the build made.
# - A closed pull request removes its preview.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Preview build]
    types: [completed]
  pull_request_target:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read

# One change to gh-pages at a time, and none is dropped.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Forks start with Pages switched off. Skip the deploy with a note rather than
  # failing on every merge until someone turns it on.
  check:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.pull_requests[0].number)
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages")
          case "$status" in
            200)
              echo "enabled=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              echo "::notice title=GitHub Pages is off::Nothing was deployed. To play your carnival online, go to Settings > Pages, set Source to GitHub Actions, then re-run this workflow. See 'Try it on your own' in the README."
              ;;
            *)
              echo "::error title=Couldn't check GitHub Pages::The Pages API answered HTTP $status, so it's unclear whether Pages is on. Re-run this workflow."
              exit 1
              ;;
          esac

  update:
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    outputs:
      preview: ${{ steps.files.outputs.preview }}
    steps:
      # main's own code, never a pull request's.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: main
      - name: Check out gh-pages, or start it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code "$url" gh-pages >/dev/null; then
            git clone --depth 1 --branch gh-pages "$url" site
          else
            git init -b gh-pages site
            git -C site remote add origin "$url"
          fi
          touch site/.nojekyll

      - name: Build main into the root
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        working-directory: main
        run: |
          npm ci
          npm run build
          find ../site -mindepth 1 -maxdepth 1 ! -name .git ! -name previews ! -name .nojekyll -exec rm -rf {} +
          cp -R dist/. ../site/

      - name: Copy the pull request's preview
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v8
        with:
          name: preview
          path: preview
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - id: files
        name: Place or remove the preview
        env:
          EVENT: ${{ github.event_name }}
          RUN_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          CLOSED_PR: ${{ github.event.pull_request.number }}
        run: |
          case "$EVENT" in
            workflow_run)
              [[ "$RUN_PR" =~ ^[0-9]+$ ]] || { echo "::error::Not a pull request number: $RUN_PR"; exit 1; }
              rm -rf "site/previews/pr-$RUN_PR"
              mkdir -p "site/previews/pr-$RUN_PR"
              cp -R preview/. "site/previews/pr-$RUN_PR/"
              echo "preview=$RUN_PR" >> "$GITHUB_OUTPUT"
              ;;
            pull_request_target)
              [[ "$CLOSED_PR" =~ ^[0-9]+$ ]] || exit 1
              rm -rf "site/previews/pr-$CLOSED_PR"
              ;;
          esac

      - name: Commit and push gh-pages
        working-directory: site
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed on gh-pages."
          else
            git commit --quiet -m "Update the site for ${GITHUB_EVENT_NAME} ${GITHUB_SHA::7}"
            git push --quiet origin gh-pages
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  comment:
    needs: [update, deploy]
    if: needs.update.outputs.preview != ''
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ needs.update.outputs.preview }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          site=$(gh api "repos/$GH_REPO/pages" --jq .html_url)
          url="${site%/}/previews/pr-$PR/"
          body="<!-- pr-preview -->
          **Preview:** $url (built from ${SHA::7}). It updates on every push and is removed when this pull request closes."
          id=$(gh api "repos/$GH_REPO/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- pr-preview -->")))][0].id // empty')
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GH_REPO/issues/comments/$id" -f body="$body" >/dev/null
          else
            gh pr comment "$PR" --body "$body"
          fi
