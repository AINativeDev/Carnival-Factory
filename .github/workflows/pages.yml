name: Deploy to GitHub Pages

# Publishes the site: the live map at the root, and a preview of every open
# pull request at previews/pr-<number>/. The files live on the gh-pages branch,
# and every run publishes it as a whole.
#
# Every run reconciles the previews with the open pull requests: a preview is
# removed once its pull request closes, and replaced by the successful
# "Preview build" of the pull request's current head commit. So a run GitHub
# drops from the queue, or a build that finishes late, is put right by the
# next one. Every run also rebuilds the root from main. Nothing here checks out or
# runs a pull request's code: it only copies the files its build made.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Preview build]
    types: [completed]
  pull_request_target:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read

# One change to gh-pages at a time, and none is dropped.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Forks start with Pages switched off. Skip the deploy with a note rather than
  # failing on every merge until someone turns it on.
  check:
    permissions:
      pages: read
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.pull_requests[0].number)
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages")
          case "$status" in
            200)
              echo "enabled=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              echo "::notice title=GitHub Pages is off::Nothing was deployed. To play your carnival online, go to Settings > Pages, set Source to GitHub Actions, then re-run this workflow. See 'Try it on your own' in the README."
              ;;
            *)
              echo "::error title=Couldn't check GitHub Pages::The Pages API answered HTTP $status, so it's unclear whether Pages is on. Re-run this workflow."
              exit 1
              ;;
          esac

  update:
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      pull-requests: read
    outputs:
      placed: ${{ steps.files.outputs.placed }}
    steps:
      # main's own code, never a pull request's.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: main
      - name: Check out gh-pages, or start it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code "$url" gh-pages >/dev/null; then
            git clone --depth 1 --branch gh-pages "$url" site
          else
            git init -b gh-pages site
            git -C site remote add origin "$url"
          fi
          touch site/.nojekyll

      # Every run rebuilds the root from main, not only a push: GitHub keeps one
      # pending run per group and drops the rest, so a push's run can be
      # replaced by the next event, and that run must still publish main.
      - name: Build main into the root
        working-directory: main
        run: |
          npm ci
          npm run build
          find ../site -mindepth 1 -maxdepth 1 ! -name .git ! -name previews ! -name .nojekyll -exec rm -rf {} +
          cp -R dist/. ../site/

      - id: files
        name: Reconcile the previews with the open pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p site/previews
          open=$(gh pr list --state open --limit 500 \
            --json number,headRefOid,isCrossRepository \
            --jq '.[] | select(.isCrossRepository | not) | "\(.number) \(.headRefOid)"')

          # Remove the previews of pull requests that are no longer open.
          for dir in site/previews/pr-*; do
            [ -d "$dir" ] || continue
            number=${dir##*/pr-}
            grep -q "^$number " <<<"$open" || rm -rf "$dir"
          done

          # Place each open pull request's preview from the build of its head.
          placed=()
          while read -r number sha; do
            [[ "$number" =~ ^[0-9]+$ && "$sha" =~ ^[0-9a-f]{40}$ ]] || continue
            dir="site/previews/pr-$number"
            [ "$(cat "$dir/.preview-sha" 2>/dev/null)" = "$sha" ] && continue
            run=$(gh run list --workflow preview-build.yml --commit "$sha" --status success \
              --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$run" ] || continue
            rm -rf "$dir"
            gh run download "$run" --name preview --dir "$dir"
            echo "$sha" > "$dir/.preview-sha"
            placed+=("$number:$sha")
          done <<<"$open"
          echo "placed=${placed[*]}" >> "$GITHUB_OUTPUT"

      - name: Commit and push gh-pages
        working-directory: site
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed on gh-pages."
          else
            git commit --quiet -m "Update the site for ${GITHUB_EVENT_NAME} ${GITHUB_SHA::7}"
            git push --quiet origin gh-pages
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  comment:
    needs: [update, deploy]
    if: needs.update.outputs.placed != ''
    runs-on: ubuntu-latest
    permissions:
      pages: read
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PLACED: ${{ needs.update.outputs.placed }}
        run: |
          site=$(gh api "repos/$GH_REPO/pages" --jq .html_url)
          for entry in $PLACED; do
            pr=${entry%%:*}
            sha=${entry#*:}
            url="${site%/}/previews/pr-$pr/"
            body="<!-- pr-preview -->
          **Preview:** $url (built from ${sha::7}). It updates on every push and is removed when this pull request closes."
            id=$(gh api "repos/$GH_REPO/issues/$pr/comments" --paginate \
              --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- pr-preview -->"))) | .id' | head -1)
            if [ -n "$id" ]; then
              gh api -X PATCH "repos/$GH_REPO/issues/comments/$id" -f body="$body" >/dev/null
            else
              gh pr comment "$pr" --body "$body"
            fi
          done
