name: Deploy to GitHub Pages

# Publishes the site: the live map at the root, and a preview of every open
# pull request at previews/pr-<number>/. The files live on the gh-pages branch,
# and every run publishes it as a whole.
#
# Every run reconciles the previews with the open pull requests: a preview is
# replaced by a redirect to the live map once its pull request closes, and
# replaced by the successful
# "Preview build" of the pull request's current head commit. So a run GitHub
# drops from the queue, or a build that finishes late, is put right by the
# next one. Every run also rebuilds the root from main. Nothing here checks out or
# runs a pull request's code: it only copies the files its build made.
#
# An issue labelled, unlabelled or closed also runs it, from main's own code,
# so a booth request that's just been accepted shows its construction site on
# the map within a couple of minutes, and one that moved along shows its new
# stage. So does `needs-human` going on or off a pull request, for the
# "Waiting for a maintainer" stage; the auto-merge gate's own token starts no
# workflows, so the gate dispatches this one when it puts that label on.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Preview build]
    types: [completed]
  pull_request_target:
    types: [closed, labeled, unlabeled]
  issues:
    types: [labeled, unlabeled, closed]
  workflow_dispatch:

permissions:
  contents: read

# One change to gh-pages at a time, and none is dropped.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Forks start with Pages switched off. Skip the deploy with a note rather than
  # failing on every merge until someone turns it on.
  check:
    permissions:
      pages: read
    # A merged pull request also pushes to main, and that run retires its
    # preview too, so the close event only publishes for one closed unmerged.
    # One run instead of two puts a merged booth on the map sooner. Issue
    # events only matter for booth requests: they move a construction site.
    if: >-
      (github.event_name == 'pull_request_target' &&
       ((github.event.action == 'closed' && !github.event.pull_request.merged) ||
        github.event.label.name == 'needs-human')) ||
      (github.event_name == 'issues' &&
       contains(github.event.issue.labels.*.name, 'booth-request')) ||
      github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.pull_requests[0].number)
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages")
          case "$status" in
            200)
              echo "enabled=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              echo "::notice title=GitHub Pages is off::Nothing was deployed. To play your carnival online, go to Settings > Pages, set Source to GitHub Actions, then re-run this workflow. See 'Try it on your own' in the README."
              ;;
            *)
              echo "::error title=Couldn't check GitHub Pages::The Pages API answered HTTP $status, so it's unclear whether Pages is on. Re-run this workflow."
              exit 1
              ;;
          esac

  update:
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      # The squares' histories, and the accepted Elf Engineer badge requests
      # for the badge holders.
      issues: read
      pull-requests: read
      # The checks on the booth requests' pull requests, for their stage.
      checks: read
      # The People's Choice votes, and a comment in its discussion for each new entry.
      discussions: write
    outputs:
      placed: ${{ steps.files.outputs.placed }}
    steps:
      # main's own code, never a pull request's.
      - uses: actions/checkout@v7
        with:
          # Keep the token out of .git/config, where the code that runs next could read it.
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
          path: main
          # The whole history, so the build can tell when each booth first appeared.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: main/.nvmrc
          cache: npm
          cache-dependency-path: main/package-lock.json
      - name: Check out gh-pages, or start it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code "$url" gh-pages >/dev/null; then
            git clone --depth 1 --branch gh-pages "$url" site
          else
            git init -b gh-pages site
            git -C site remote add origin "$url"
          fi
          touch site/.nojekyll

      # How every square was built, for its "How was this built?" panel: read
      # from the public issues and pull requests, and bundled into the page by
      # the build. Without it the site still publishes, with no timelines.
      - name: Read every square's history
        working-directory: main
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/write-square-history.ts ||
            echo "::warning title=No square history::Couldn't read the issues and pull requests, so the squares' timelines are empty in this build."

      # The accepted booth requests not merged yet, for their construction
      # sites: worked out afresh every run and never committed. The build
      # copies public/pending.json beside the page. Without it, the build
      # writes an empty list and the map shows no construction sites.
      - name: List the booths being built
        working-directory: main
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          timeout 2m node scripts/write-pending.ts public/pending.json || {
            rm -f public/pending.json
            echo "::warning title=No booths being built::Couldn't read the booth requests, so this build shows no construction sites."
          }

      # Every booth owner's avatar, for the signs and the booths' insides,
      # bundled into the site so visitors make no requests to GitHub. An owner
      # without one gets the elf-silhouette fallback.
      - name: Download the booth owners' avatars
        working-directory: main
        run: |
          node scripts/download-avatars.ts ||
            echo "::warning title=No avatars::Couldn't download the booth owners' avatars, so this build shows the fallback."

      # The Elf Engineer badge holders, from the accepted badge requests, for
      # the build to bake into the page: the page itself never asks the network.
      - name: List the Elf Engineer badge holders
        working-directory: main
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # A failed or slow read publishes the map without pins rather than
        # holding up the deploy.
        run: |
          timeout 2m node scripts/badge-holders.ts "$RUNNER_TEMP/badge-holders.json" || {
            echo "::warning title=No badge holders::Couldn't read the Elf Engineer badge requests, so this build has no badge pins."
            echo '[]' > "$RUNNER_TEMP/badge-holders.json"
          }

      # The People's Choice standings, from the 👍 in its discussion, for the
      # build to bake into the page. It also adds a comment for every new booth
      # and home factory. Without the discussion, the map shows no standings.
      - name: Count the People's Choice votes
        working-directory: main
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BADGE_HOLDERS_FILE: ${{ runner.temp }}/badge-holders.json
        run: |
          timeout 2m node scripts/write-peoples-choice.ts "$RUNNER_TEMP/peoples-choice.json" || {
            rm -f "$RUNNER_TEMP/peoples-choice.json"
            echo "::warning title=No People's Choice standings::Couldn't read the votes, so this build shows no standings."
          }

      # Every run rebuilds the root from main, not only a push: GitHub keeps one
      # pending run per group and drops the rest, so a push's run can be
      # replaced by the next event, and that run must still publish main.
      - name: Build main into the root
        working-directory: main
        run: |
          npm ci
          BADGE_HOLDERS_FILE="$RUNNER_TEMP/badge-holders.json" \
            PEOPLES_CHOICE_FILE="$RUNNER_TEMP/peoples-choice.json" npm run build
          # Pages lets caches keep a page for up to 10 minutes, so a visitor can
          # still be on the last build, asking for its files. Built files have
          # a hash in their name, so old and new never clash: keep the old ones
          # for a week, listed with the day they were last part of a build, and
          # replace everything else.
          kept=../site/assets-kept.txt
          today=$(date -u +%Y-%m-%d)
          cutoff=$(date -u -d '7 days ago' +%Y-%m-%d)
          # The first time, the files already published are the last build's.
          [ -s "$kept" ] || find ../site/assets -maxdepth 1 -type f -printf "$today %f\n" > "$kept" 2>/dev/null || true
          find ../site -mindepth 1 -maxdepth 1 ! -name .git ! -name previews ! -name .nojekyll \
            ! -name assets ! -name assets-kept.txt -exec rm -rf {} +
          cp -R dist/. ../site/
          # This build's files are current as of today; drop files unused for a week.
          find dist/assets -maxdepth 1 -type f -printf "$today %f\n" > new-kept.txt
          awk -v cutoff="$cutoff" 'NR==FNR { current[$2] = 1; print; next }
            !($2 in current) && $1 >= cutoff { print }' new-kept.txt "$kept" > merged-kept.txt
          for file in ../site/assets/*; do
            name=$(basename "$file")
            grep -q " $name\$" merged-kept.txt || rm -f "$file"
          done
          mv merged-kept.txt "$kept"

      - id: files
        name: Reconcile the previews with the open pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p site/previews
          open=$(gh pr list --state open --limit 500 \
            --json number,headRefOid,isCrossRepository \
            --jq '.[] | select(.isCrossRepository | not) | "\(.number) \(.headRefOid)"')

          # Closed pull requests whose preview is already gone, such as ones
          # closed before this existed, get the same redirect below.
          for number in $(gh pr list --state closed --limit 200 --json number --jq '.[].number'); do
            [[ "$number" =~ ^[0-9]+$ ]] || continue
            [ -d "site/previews/pr-$number" ] || mkdir -p "site/previews/pr-$number"
          done

          # A closed pull request's preview becomes a tiny page that sends its
          # links on to the live map, keeping the part after #, so a link
          # shared from a merged pull request still lands on that booth.
          for dir in site/previews/pr-*; do
            [ -d "$dir" ] || continue
            number=${dir##*/pr-}
            grep -q "^$number " <<<"$open" && continue
            [ -f "$dir/closed.txt" ] && continue
            rm -rf "$dir"
            mkdir -p "$dir"
            echo "closed" > "$dir/closed.txt"
            cat > "$dir/index.html" <<'HTML'
          <!doctype html>
          <meta charset="utf-8" />
          <title>North Pole Carnival</title>
          <meta name="robots" content="noindex" />
          <script>location.replace('../../' + location.hash);</script>
          <p>This preview has closed. <a href="../../">Go to the North Pole Carnival</a>.</p>
          HTML
          done

          # Place each open pull request's preview from the build of its head.
          placed=()
          while read -r number sha; do
            [[ "$number" =~ ^[0-9]+$ && "$sha" =~ ^[0-9a-f]{40}$ ]] || continue
            dir="site/previews/pr-$number"
            if [ "$(cat "$dir/.preview-sha" 2>/dev/null)" = "$sha" ]; then
              # Already the head's build: just make sure the visible marker
              # exists, for previews placed before it was added.
              [ -f "$dir/preview-sha.txt" ] || echo "$sha" > "$dir/preview-sha.txt"
              continue
            fi
            run=$(gh run list --workflow preview-build.yml --commit "$sha" --status success \
              --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$run" ] || continue
            rm -rf "$dir"
            gh run download "$run" --name preview --dir "$dir"
            # The smoke test's screenshots, if it made any: only PNGs with plain
            # names are copied, so they can't add pages to the site.
            shots=$(mktemp -d)
            if gh run download "$run" --name screenshots --dir "$shots" 2>/dev/null; then
              mkdir -p "$dir/screenshots"
              find "$shots" -maxdepth 1 -type f -regextype posix-extended \
                -regex '.*/(map|(booth|attraction)-[a-z0-9]+(-[a-z0-9]+)*)\.png' \
                -exec cp {} "$dir/screenshots/" \;
            fi
            echo "$sha" > "$dir/.preview-sha"
            # The Pages artifact leaves out hidden files, so publish it visibly too.
            echo "$sha" > "$dir/preview-sha.txt"
            placed+=("$number:$sha")
          done <<<"$open"
          echo "placed=${placed[*]}" >> "$GITHUB_OUTPUT"

      - name: Commit and push gh-pages
        working-directory: site
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed on gh-pages."
          else
            git commit --quiet -m "Update the site for ${GITHUB_EVENT_NAME} ${GITHUB_SHA::7}"
            git push --quiet origin gh-pages
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  comment:
    needs: [update, deploy]
    if: needs.update.outputs.placed != ''
    runs-on: ubuntu-latest
    permissions:
      pages: read
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PLACED: ${{ needs.update.outputs.placed }}
        run: |
          site=$(gh api "repos/$GH_REPO/pages" --jq .html_url)
          for entry in $PLACED; do
            pr=${entry%%:*}
            sha=${entry#*:}
            url="${site%/}/previews/pr-$pr/"
            # A direct link to every booth, attraction and level the pull request changes,
            # and their screenshots side by side under the map's, each opening its square.
            squares=$(gh api "repos/$GH_REPO/pulls/$pr/files" --paginate --jq '.[].filename' |
              sed -nE 's#^(booth|attraction|level)s/([a-z0-9]+(-[a-z0-9]+)*)/.*#\1/\2#p' | sort -u)
            links=""
            row=""
            shots="${url}screenshots"
            for square in $squares; do
              links="$links
          - [\`$square\`](${url}#/$square)"
              row="$row<a href=\"${url}#/$square\"><img src=\"$shots/${square%%/*}-${square#*/}.png\" alt=\"$square\" width=\"160\"></a> "
            done
            body="<!-- pr-preview -->
          **Preview:** $url (built from ${sha::7}). It updates on every push. Once this pull request closes, its links take you to the live map.

          <img src=\"${url}screenshots/map.png\" alt=\"The map in this preview\" width=\"480\">"
            if [ -n "$links" ]; then
              body="$body

          **Changed here:**

          $row
          $links"
            fi
            id=$(gh api "repos/$GH_REPO/issues/$pr/comments" --paginate \
              --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- pr-preview -->"))) | .id' | head -1)
            if [ -n "$id" ]; then
              gh api -X PATCH "repos/$GH_REPO/issues/comments/$id" -f body="$body" >/dev/null
            else
              gh pr comment "$pr" --body "$body"
            fi
          done
