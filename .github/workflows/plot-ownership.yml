name: Plot ownership

# Every participant may only change their own plot, src/plots/<login>/. This
# runs on pull_request_target so it uses the checker from main, never one a
# pull request has edited, and it never checks out or runs the pull request's
# code: it only reads the list of changed files from the API.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  ownership:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: node scripts/check-plot-ownership.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
