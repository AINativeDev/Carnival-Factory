name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Keep the token out of .git/config, where the code that runs next could read it.
          persist-credentials: false
          # The merge commit's first parent is the base: enough to see what changed.
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # A pull request that only changes one booth's or one level's folder checks
      # that folder (scripts/square-check.ts, docs/adr/0053); anything else, and
      # every push to main, runs the full check.
      - name: Check
        env:
          EVENT: ${{ github.event_name }}
        run: |
          scope=""
          if [ "$EVENT" = pull_request ]; then
            scope=$(git diff --name-only HEAD^1 HEAD | node scripts/square-check.ts)
          fi
          if [ -n "$scope" ]; then
            echo "Checking only $scope."
            echo "SQUARE_SCOPE=$scope" >> "$GITHUB_ENV"
            node scripts/square-check.ts run "$scope"
          else
            npm run check
          fi
      # New and changed lines need 99% unit-test coverage (docs/adr/0025).
      # The pull request's merge commit is compared with its own base (HEAD^1),
      # as the Check step reads it: a newer main's lines aren't this change's.
      # A booth's or level's folder check changes no lines of src/, scripts/ or
      # lint/, and records no coverage, so there's nothing for this to measure.
      - name: Coverage of changed lines
        if: github.event_name == 'pull_request' && env.SQUARE_SCOPE == ''
        run: node scripts/diff-coverage.ts HEAD^1
      # The code a pull request changes in src/, scripts/ and lint/ needs a
      # mutation score of 90%: its tests must catch most small changes to it,
      # not just run it (docs/adr/0061-mutation-testing.md).
      - name: Mutation testing of changed code
        if: github.event_name == 'pull_request' && env.SQUARE_SCOPE == ''
        # Against the merge commit's own base (HEAD^1), as the Check step reads it:
        # a newer main would count its own changes as this pull request's.
        run: node scripts/mutation-check.ts --changed HEAD^1
      # Baselines only shrink: no debt added or raised (AGENTS.md). Against the
      # merge commit's own base (HEAD^1): a debt main lowered since this branched
      # would otherwise look raised here.
      - name: Baselines only shrink
        if: github.event_name == 'pull_request'
        run: node scripts/baselines-shrink.ts HEAD^1
      - run: npm run build

  shell:
    # Shell scripts through ShellCheck, and workflows through actionlint, which
    # also checks every run: step with ShellCheck (docs/adr/0022).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: shellcheck setup.sh
      - run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color
