name: Auto-merge digest

# Once a day, lists the booths that merged on their own in the last 24 hours in
# one issue, so a person still sees every one. A maintainer who spots a problem
# can switch the booth off in northpole/disabled.json.
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          since=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          site=$(gh api "repos/$GH_REPO/pages" --jq .html_url 2>/dev/null || echo "")
          rows=$(gh pr list --state merged --label auto-merged --limit 100 \
            --json number,title,mergedAt,url \
            --jq ".[] | select(.mergedAt >= \"$since\") | \"- [#\(.number)](\(.url)) \(.title)\"")
          if [ -z "$rows" ]; then
            echo "Nothing merged on its own since $since."
            exit 0
          fi
          body="These booth changes merged on their own in the last 24 hours, after passing every check in the auto-merge gate. Have a look at each on the map${site:+ ($site)}. To switch one off, add its owner's login to the booths list in northpole/disabled.json.

          $rows"
          gh issue create --title "Booths that merged on their own, $(date -u +%Y-%m-%d)" --body "$body"
