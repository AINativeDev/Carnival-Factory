name: Preview build

# Builds a pull request so it can be previewed on the live site. This runs the
# pull request's code, so it gets no secrets and a read-only token. It only
# uploads the built files: publishing them is "Deploy to GitHub Pages", which
# runs from main and never runs pull request code.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # The build and the smoke test run on separate runners, so code the smoke
  # test plays never shares a machine with the files that get published. Lint,
  # types and tests run once, in CI's check job.
  build:
    # Outside pull requests are closed (see outside-pull-requests.yml), and
    # their previews would publish code nobody here wrote.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Keep the token out of .git/config, where the code that runs next could read it.
          persist-credentials: false
          # The whole history, so the build can tell when each booth first appeared.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: preview
          path: dist
          retention-days: 7

  # Every booth and attraction in a real browser, in its real sandbox. Its
  # screenshots go in the pull request's preview comment.
  smoke:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Keep the token out of .git/config, where the code that runs next could read it.
          persist-credentials: false
          # The merge commit's first parent is the base: enough to see what changed.
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # A pull request that only changes one booth's folder plays just that booth,
      # in Chromium, without the page coverage: a sandboxed booth can't change the
      # site, so the rest of the suite would test untouched code (docs/adr/0051).
      - name: Play only the changed booth, if that's all that changes
        run: |
          scope=$(git diff --name-only HEAD^1 HEAD | node scripts/smoke-scope.ts)
          if [ -n "$scope" ]; then
            echo "SMOKE_ONLY=$scope" >> "$GITHUB_ENV"
            echo "Playing only $scope: its own specs, in Chromium."
          else
            echo "COVERAGE=1" >> "$GITHUB_ENV"
          fi
      - if: env.SMOKE_ONLY == ''
        run: npx playwright install --with-deps chromium webkit
      - if: env.SMOKE_ONLY != ''
        run: npx playwright install --with-deps chromium
      - run: npm run smoke
        env:
          CI: 'true'
      # The unit tests and the browser tests together, line by line, held to the
      # floor in lint/combined-coverage-floor.json (docs/adr/0032). A booth-only
      # run records no page coverage, so it skips this.
      - name: Combined line coverage
        if: env.SMOKE_ONLY == ''
        run: |
          npx vitest run --coverage --coverage.thresholds.autoUpdate=false > /dev/null
          npm run coverage:combined
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7
