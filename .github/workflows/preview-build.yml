name: Preview build

# Builds a pull request so it can be previewed on the live site. This runs the
# pull request's code, so it gets no secrets and a read-only token. It only
# uploads the built files: publishing them is "Deploy to GitHub Pages", which
# runs from main and never runs pull request code.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Two jobs on two runners: the tests run a booth's test code, so they never
  # share a machine with the files that get published. "Deploy to GitHub
  # Pages" only places a preview when the whole run succeeded, tests included.
  build:
    # Outside pull requests are closed (see outside-pull-requests.yml), and
    # their previews would publish code nobody here wrote.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Keep the token out of .git/config, where the code that runs next could read it.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: preview
          path: dist
          retention-days: 7

  test:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Keep the token out of .git/config, where the code that runs next could read it.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check

  # Every booth and attraction in a real browser, in its real sandbox. Its
  # screenshots go in the pull request's preview comment.
  smoke:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Keep the token out of .git/config, where the code that runs next could read it.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
        env:
          CI: 'true'
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7
