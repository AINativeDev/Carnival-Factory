name: Preview build

# Builds a pull request so it can be previewed on the live site. This runs the
# pull request's code, so it gets no secrets and a read-only token. It only
# uploads the built files: publishing them is "Deploy to GitHub Pages", which
# runs from main and never runs pull request code.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    # Outside pull requests are closed (see outside-pull-requests.yml), and
    # their previews would publish code nobody here wrote.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Build before the tests run, and keep that build aside: test code in a
      # booth runs in Node, so it must not get a chance to change the sources
      # or the built files that are published.
      - run: npm run build && mv dist "$RUNNER_TEMP/preview"
      - run: npm run check
      - uses: actions/upload-artifact@v7
        with:
          name: preview
          path: ${{ runner.temp }}/preview
          retention-days: 7
