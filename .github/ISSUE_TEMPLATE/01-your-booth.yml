name: Your booth
description: Ask the factory to build your booth on the North Pole map, or to change it.
title: 'My booth: '
labels: [booth-request]
body:
  - type: markdown
    attributes:
      value: |
        Describe your booth and the factory builds it in `carnival/booths/<your GitHub login>/`.
        If you already have one, it changes it. Your latest request is the one that counts.
        [How your request is built](https://github.com/AINativeDev/Northpole-Carnival-Factory/blob/main/docs/how-it-works.md)
        · [Booth ideas](https://github.com/AINativeDev/Northpole-Carnival-Factory/blob/main/docs/booth-ideas.md)
  - type: textarea
    id: what
    attributes:
      label: What should your booth show?
      description: |
        A few sentences are plenty. Things you can mention:
        - **The scene**: who or what is in it, and what they're doing
        - **What moves**: a loop every few seconds, or what happens when someone taps it (a game?)
        - **The look**: the North Pole's own [diorama style](https://github.com/AINativeDev/Northpole-Carnival-Factory/blob/main/docs/style.md) by default, or pixel art, papercut, storybook…
        - **The stall**: a market stall, shed, tent, log cabin or kiosk, and a roof colour
        - **Little details**: a sign, a pet, a friendly joke, the colours you like

        For a change, say what should be different. You can attach a picture, such as your logo or a sketch, and the factory redraws it in shapes.
      placeholder: |
        A frozen pond at dusk. Two penguins in scarves skate figure eights every few
        seconds, and a third wobbles at the edge with a cup of cocoa. Tap the pond and
        a fish jumps. A log cabin stall with a gold roof, and a tiny sign: "Thin ice,
        skate anyway".
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Your booth's name
      description: Shown on its sign, up to about 24 characters. Leave it empty to keep the name it has.
      placeholder: Penguin Pond
