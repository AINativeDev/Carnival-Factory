name: Change your plot
description: Ask the factory for a change to a plot you already own.
title: 'Change my plot: '
labels: [plot-change]
body:
  - type: markdown
    attributes:
      value: |
        You can only change your own plot, `src/plots/<your GitHub login>/`. A
        change for anyone else's plot, or for the map itself, fails the plot
        ownership check.
  - type: textarea
    id: what
    attributes:
      label: What should change?
      description: What people would see on your plot once it's done.
      placeholder: Make the penguins wave when the mouse is over them.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: A short checklist the agent can test its work against.
      value: |
        - [ ]
        - [ ] Every change is inside `src/plots/<my login>/`
        - [ ] `npm run check` passes
    validations:
      required: true
