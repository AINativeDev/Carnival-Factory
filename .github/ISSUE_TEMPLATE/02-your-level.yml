name: Your level
description: Ask the factory to build a whole carnival level of your own, reached by sleigh from the North Pole, or to change it.
title: 'My level: '
labels: [level-request]
body:
  - type: markdown
    attributes:
      value: |
        A level is a whole patch of the North Pole of your own, with up to 8 squares, that
        visitors reach by sleigh. The factory builds it in `carnival/levels/<your GitHub login>/`,
        or changes the one you have. Your latest request is the one that counts.
        [How your request is built](https://github.com/AINativeDev/Northpole-Carnival-Factory/blob/main/docs/how-it-works.md)
        · [Level ideas](https://github.com/AINativeDev/Northpole-Carnival-Factory/blob/main/docs/level-ideas.md)
  - type: textarea
    id: what
    attributes:
      label: What should your level be?
      description: |
        A few sentences are plenty. Things you can mention:
        - **The place**: what it is, and how it's laid out
        - **Its squares**: up to 8 stalls people can go inside, and what each one shows
        - **Landmarks**: two or three things to find, such as a pond, a big tree, a bridge
        - **What moves**: skaters, a stream, steam from the cocoa
        - **The theme**: dusk, aurora night, candy cane, frozen lake or gingerbread

        For a change, say what should be different. You can attach a sketch of the layout.
      placeholder: |
        A frozen-lake fair under the aurora. A big pond in the middle with skaters going
        round, a skate rental hut on one side, a cocoa hut on the other, and an
        ice-fishing hole on the shore where a fish bites now and then.
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Your level's name
      description: Shown on its platform at the sleigh station, up to about 24 characters. Leave it empty to keep the name it has.
      placeholder: Frozen Lake Fair
